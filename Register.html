<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Technology World</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #020617, #0b1120);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e5e7eb;
        }

        .register-box {
            background-color: #020617;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .register-box h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #38bdf8;
        }

        .register-box p {
            text-align: center;
            font-size: 0.9rem;
            margin-bottom: 30px;
            color: #cbd5f5;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: none;
            outline: none;
            background-color: #0b1120;
            color: #e5e7eb;
        }

        .form-group input::placeholder {
            color: #94a3b8;
        }

        .form-group input:focus {
            border: 1px solid #38bdf8;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #38bdf8;
            color: #020617;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: #0ea5e9;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
        }

        .login-link a {
            color: #38bdf8;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="register-box">
        <h2>Create Your Account</h2>
        <p>Register Form</p>

        <form onsubmit="return" RegisterFormValidation()>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="username" id="username" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" id="password" placeholder="Create password" required>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" name="password" id="password" placeholder="Confirm password" required>
            </div>

            <button class="btn"><a href="log.html">Register</a>
            </button>
        </form>

        <div class="login-link">
            Already have an account?
            <a href="log.html">Login</a>
        </div>
    </div>

     <script>
        function RegisterFormValidation()
        {
            let username=document.getElementById("username").value
            let email=document.getElementById("email").value
            let password=document.getElementById("password").value
            if(username<8)
            {  
                alert("Username must be more than 8 characters")
                return false;
            }
            else if(email=="")
            {
                alert("email must be content/not empty")
                clearFields()
                return false;
            }
            else if(Password=="")
            {
                alert("password must be content/not empty")
                clearFields()
                return false;
            }
            function clearFields()
            {
                let username=document.getElementById("username")
                let email=document.getElementById("email")
                let password=document.getElementById("password")
                username.value=""
                email.value=""
                password.value=""
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>

    <title>Document</title>
</head>
<body>
    <form onsubmit="return" loginFormValidation()>
        <input type="text" name="username" id="username" placeholder="EnterUsername"><br>
        <input type="text" name="username" id="username" placeholder="EnterPassword">
        <button type="submit">login</button>
    </form>
    <script>
        function loginFormValidation()
        {
            let.username=document.getElementById("username").value
            let.Password=document.getElementById("password").value
            if(username=="")
            {  
                alert("Username must be more than 8 characters")
                return false;
            }
            else if(Password=="")
            {
                alert("password must be content/not empty")
                clearFields()
                return false;
            }
            else if(username=="admin" && password=="12345")
            {
                alert("login success...")
                window.location.href="success.html"
                return false;
            }
            else
            {
                alert("Invalid username/password")
                clearFields()
                return false;
            }
            function clearFields()
            {
                let username=document.getElementById("username")
                let password=document.getElementById("password")
                username.value=""
                password.value=""
            }
        }
    </script>
</body>

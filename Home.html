<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technology World</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0b1120;
            color: #e5e7eb;
        }

        /* Navbar */
        header {
            background-color: #020617;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            color: #38bdf8;
        }

        nav a {
            color: #e5e7eb;
            margin-left: 20px;
            text-decoration: none;
            font-weight: 500;
        }

        nav a:hover {
            color: #38bdf8;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 100px 20px;
            background: linear-gradient(135deg, #020617, #0b1120);
        }

        .hero h2 {
            font-size: 3rem;
            color: #38bdf8;
            margin-bottom: 20px;
        }

        .hero p {
            max-width: 700px;
            margin: auto;
            font-size: 1.1rem;
            color: #cbd5f5;
        }

        .hero button {
            margin-top: 30px;
            padding: 12px 30px;
            background-color: #38bdf8;
            color: #020617;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
        }

        .hero button:hover {
            background-color: #0ea5e9;
        }

        /* Section */
        section {
            padding: 70px 40px;
            max-width: 1100px;
            margin: auto;
        }

        section h3 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 40px;
            color: #38bdf8;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
        }

        .card {
            background-color: #020617;
            padding: 25px;
            border-radius: 10px;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-10px);
        }

        .card h4 {
            color: #38bdf8;
            margin-bottom: 15px;
        }

        .card p {
            color: #cbd5f5;
            font-size: 0.95rem;
        }

        /* Footer */
        footer {
            background-color: #020617;
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <header>
        <h1>Technoin</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">Security</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <div class="hero">
        <h2>Explore the World of Technology</h2>
        <p>
            The Science of Today is the technology of Tomorrow<br>
            -Edward Teller
        </p>
        <button><a href="started.html">Get Started</a></button>
    </div>

    <footer>
        © 2026 Technology World | All Rights Reserved
    </footer>

</body>
</html>

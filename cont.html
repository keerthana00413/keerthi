<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact Us | Technology World</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ===== GLOBAL ===== */
body {
  margin: 0;
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  color: #00e5ff;
  min-height: 100vh;
}

/* ===== SITE HEADER ===== */
.site-header {
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(8px);
  padding: 16px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(0, 229, 255, 0.3);
}

.site-header .logo {
  font-size: 22px;
  font-weight: bold;
  letter-spacing: 1px;
}

.site-header nav a {
  color: #e5e7eb;
  text-decoration: none;
  margin-left: 20px;
  font-size: 14px;
}

.site-header nav a:hover {
  text-shadow: 0 0 8px #00e5ff;
}

/* ===== PAGE WRAPPER ===== */
.page-wrapper {
  display: flex;
  justify-content: center;
  align-items: center;
  height: calc(100vh - 80px);
}

/* ===== CONTACT CARD WITH TECH BORDER ===== */
.contact-card {
  width: 440px;
  padding: 30px;
  background: #0b0f19;
  border-radius: 16px;
  position: relative;
  box-shadow: inset 0 0 20px rgba(0, 229, 255, 0.25);
}

.contact-card::before {
  content: "";
  position: absolute;
  inset: -2px;
  border-radius: 18px;
  background: linear-gradient(90deg, #00e5ff, #00ff9d, #00e5ff);
  z-index: -1;
  animation: glow 4s linear infinite;
}

/* ===== CONTENT ===== */
.contact-title {
  text-align: center;
  font-size: 26px;
  font-weight: bold;
  margin-bottom: 20px;
}

.contact-info {
  font-size: 15px;
  line-height: 1.9;
  margin-bottom: 20px;
}

.contact-info span {
  display: block;
}

/* ===== FORM ===== */
.contact-form input,
.contact-form textarea {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border: none;
  outline: none;
  border-radius: 6px;
  background: #111827;
  color: #fff;
}

.contact-form textarea {
  resize: none;
  height: 90px;
}

.contact-form button {
  width: 100%;
  margin-top: 15px;
  padding: 12px;
  border: none;
  border-radius: 6px;
  background: #00e5ff;
  color: #000;
  font-weight: bold;
  cursor: pointer;
}

.contact-form button:hover {
  background: #00bcd4;
}

/* ===== ANIMATION ===== */
@keyframes glow {
  0% { filter: hue-rotate(0deg); }
  100% { filter: hue-rotate(360deg); }
}
</style>
</head>

<body>

<!-- ===== HEADER ===== -->
<header class="site-header">
  <div class="logo">Technoin</div>
  <nav>
    <a href="Home.html">Home</a>
    <a href="security.html">Security</a>
    <a href="cont.html">Contact</a>
    <a href="cha.html">Chat With Us</a>
    <a href="profile.html">Profile</a>
  </nav>
</header>

<!-- ===== CONTACT SECTION ===== -->
<div class="page-wrapper">
  <div class="contact-card">
    <div class="contact-title">📞 Contact Us</div>

    <div class="contact-info">
      <span><strong>Technology Inside</strong></span>
      <span>📧 Email: keerthanameesala77@gmail.com</span>
      <span>📱 Phone: +91 98483 87739</span>
      <span>🕒 Mon – Sat: 9:00 AM – 7:00 PM</span>
    </div>

    <form class="contact-form">
      <input type="text" placeholder="Your Name" required>
      <input type="email" placeholder="Your Email" required>
      <textarea placeholder="Your Message" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </div>
</div>

</body>
</html>

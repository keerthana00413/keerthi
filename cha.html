<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Technology World</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ===== GLOBAL ===== */
body {
  margin: 0;
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  min-height: 100vh;
  color: #00e5ff;
}

/* ===== MAIN HEADER ===== */
  header {
            background-color: #020617;
            padding: 10px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            color: #38bdf8;
        }

        nav a {
            color: #e5e7eb;
            margin-left: 20px;
            text-decoration: none;
            font-weight: 500;
        }

        nav a:hover {
            color: #38bdf8;
        }

/* ===== CENTER AREA ===== */
.wrapper {
  display: flex;
  justify-content: center;
  align-items: center;
  height: calc(100vh - 80px);
}

/* ===== TECH BORDER ===== */
.tech-border {
  padding: 3px;
  border-radius: 16px;
  background: linear-gradient(90deg, #00e5ff, #00ff9d, #00e5ff);
  animation: glow 4s linear infinite;
}

/* ===== CHAT BOX ===== */
.chat-container {
  width: 480px;
  height: 460px;
  background: #0b0f19;
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: inset 0 0 15px rgba(0, 229, 255, 0.25);
}

/* ===== CHAT HEADER ===== */
.chat-header {
  background: #00e5ff;
  color: #000;
  padding: 14px;
  font-weight: bold;
  text-align: center;
  letter-spacing: 1px;
}

/* ===== CHAT BODY ===== */
.chat-body {
  flex: 1;
  padding: 12px;
  overflow-y: auto;
  background: #111827;
}

.msg {
  max-width: 75%;
  padding: 8px 12px;
  margin: 8px 0;
  border-radius: 8px;
  font-size: 14px;
}

.bot {
  background: #1f2933;
  color: #00e5ff;
}

.user {
  background: #00e5ff;
  color: #000;
  margin-left: auto;
}

/* ===== FOOTER ===== */
.chat-footer {
  display: flex;
  border-top: 1px solid #222;
}

.chat-footer input {
  flex: 1;
  padding: 12px;
  border: none;
  outline: none;
  background: #0b0f19;
  color: #fff;
}

.chat-footer button {
  background: #00e5ff;
  border: none;
  padding: 12px 16px;
  font-weight: bold;
  cursor: pointer;
}

.chat-footer button:hover {
  background: #00bcd4;
}

</style>
</head>

<body>

<!-- ===== SITE HEADER ===== -->
<header>
        <h1>Technoin</h1>
        <nav>
            <a href="Home.html">Home</a>
            <a href="security.html">Security</a>
            <a href="cont.html">Contact</a>
            <a href="chat.html">Chat With Us</a>
        </nav>
    </header>

<!-- ===== CHAT AREA ===== -->
<div class="wrapper">
  <div class="tech-border">
    <div class="chat-container">
      <div class="chat-header">💻 Tech Support Assistant</div>

      <div class="chat-body" id="chatBody">
        <div class="msg bot">
          Hello 👋 Welcome to Technology World! Ask me anything about tech.
        </div>
      </div>

      <div class="chat-footer">
        <input type="text" id="userInput" placeholder="Type your message..." />
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>
</div>

<script>
function sendMessage() {
  const input = document.getElementById("userInput");
  const chatBody = document.getElementById("chatBody");

  if (input.value.trim() === "") return;

  const userMsg = document.createElement("div");
  userMsg.className = "msg user";
  userMsg.textContent = input.value;
  chatBody.appendChild(userMsg);

  setTimeout(() => {
    const botMsg = document.createElement("div");
    botMsg.className = "msg bot";
    botMsg.textContent = "Our tech team is processing your request 🚀";
    chatBody.appendChild(botMsg);
    chatBody.scrollTop = chatBody.scrollHeight;
  }, 700);

  input.value = "";
  chatBody.scrollTop = chatBody.scrollHeight;
}
</script>

</body>
</html>
